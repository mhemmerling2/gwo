framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'mongoqueue://failed?collection=messenger_messages_failed'

        routing:
            Gwo\AppsRecruitmentTask\Lecture\EnrollStudentToLectureCommand: async

        buses:
            command.bus:
                default_middleware: false
                middleware:
                    - send_message
                    - handle_message
            query.bus:
                default_middleware: false
                middleware:
                    - handle_message

when@test:
    framework:
        messenger:
            transports:
                async: 'test://?catch_exceptions=false'
                failed: 'test://?catch_exceptions=false'
