framework:
    messenger:
        failure_transport: failed
        serializer:
            symfony_serializer:
                format: json
                context: []

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
            failed: 'mongoqueue://failed?collection=messenger_messages_failed'

        routing:
            Gwo\AppsRecruitmentTask\Lecture\EnrollStudentToLectureCommand: async

when@test:
    framework:
        messenger:
            transports:
                async: 'test://?catch_exceptions=false'
                failed: 'test://?catch_exceptions=false'
